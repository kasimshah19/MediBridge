name: MediBridge CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test Suite & Security Check
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Run Backend Unit & Integration Tests
        run: npm --prefix backend test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/medibridge_ci
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_bytes_long!!
          CRON_SECRET: ci_test_cron_secret_min_24_chars!!
          QR_SIGNING_SECRET: ci_test_qr_signing_secret_min_32_bytes_long!!

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build Frontend Application
        run: npm --prefix frontend run build
        env:
          VITE_API_URL: https://medibridge-5n0o.onrender.com/api
