services:
  - type: web
    name: medibridge-api
    runtime: node
    region: singapore
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://medi-bridge-taupe.vercel.app
      - key: STORAGE_DRIVER
        value: gridfs
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: ANALYTICS_CACHE_SECONDS
        value: "60"
      - key: REPORT_MAX_ROWS_CSV
        value: "5000"
      - key: REPORT_MAX_ROWS_PDF
        value: "500"
      - key: NOTIFICATION_RETENTION_DAYS
        value: "90"
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
