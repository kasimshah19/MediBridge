services:
  - type: web
    name: medibridge-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://medi-bridge-taupe.vercel.app
      - key: STORAGE_DRIVER
        value: gridfs
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_INTERNAL_CRON
        value: "true"
      - key: ANALYTICS_CACHE_SECONDS
        value: "60"
      - key: REPORT_MAX_ROWS_CSV
        value: "5000"
      - key: REPORT_MAX_ROWS_PDF
        value: "500"
      - key: NOTIFICATION_RETENTION_DAYS
        value: "90"
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: QR_SIGNING_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
